# ============================================
#  Echair - Docker Compose Production Setup
#  Usage: docker compose up -d --build
# ============================================

services:
  # ─── MongoDB Database ───
  mongodb:
    image: mongo:7
    container_name: echair-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      - echair-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Redis Cache & Job Queue ───
  redis:
    image: redis:7-alpine
    container_name: echair-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - echair-network

  # ─── MinIO Object Storage (Self-hosted S3-compatible) ───
  minio:
    image: minio/minio:latest
    container_name: echair-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-echair_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_secure}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - echair-network

  # ─── API Server (Express + Socket.IO) ───
  server:
    build:
      context: ..
      dockerfile: production-build/Dockerfile.server
    container_name: echair-server
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      CLIENT_URL: ${CLIENT_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-echair_admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change_me_secure}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-echair-uploads}
      S3_FORCE_PATH_STYLE: "true"
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - server_uploads:/app/uploads
      - ${FIREBASE_SERVICE_ACCOUNT_PATH:-./firebase-service-account.json}:/app/chair-f440c-firebase-adminsdk-fbsvc-92d591e38e.json:ro
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - echair-network

  # ─── Client App (React + Vite) ───
  client:
    build:
      context: ..
      dockerfile: production-build/Dockerfile.client
      args:
        CLIENT_PUBLIC_URL: ${CLIENT_PUBLIC_URL:-/app}
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-}
    container_name: echair-client
    restart: unless-stopped
    networks:
      - echair-network

  # ─── Nginx Reverse Proxy ───
  nginx:
    image: nginx:alpine
    container_name: echair-nginx
    restart: unless-stopped
    environment:
      CLIENT_PUBLIC_URL: ${CLIENT_PUBLIC_URL:-/app}
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - server
      - client
    networks:
      - echair-network

volumes:
  mongodb_data:
    driver: local
  server_uploads:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  echair-network:
    driver: bridge
