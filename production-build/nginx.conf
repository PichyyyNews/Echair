# ============================================
# Main Nginx Reverse Proxy Configuration Template
# CLIENT_PUBLIC_URL must not end with a trailing slash
# Example: /chair-demo
# ============================================

upstream server_backend {
    server server:5000;
}

upstream client_app {
    server client:80;
}


server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    location = ${CLIENT_PUBLIC_URL} {
        return 301 ${CLIENT_PUBLIC_URL}/;
    }

    # Prefixed Socket.IO endpoint
    location ${CLIENT_PUBLIC_URL}/socket.io/ {
        rewrite ^${CLIENT_PUBLIC_URL}(/socket.io/.*)$ $1 break;
        proxy_pass http://server_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix ${CLIENT_PUBLIC_URL};
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Prefixed API endpoint
    location ${CLIENT_PUBLIC_URL}/api/ {
        rewrite ^${CLIENT_PUBLIC_URL}(/api/.*)$ $1 break;
        proxy_pass http://server_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix ${CLIENT_PUBLIC_URL};
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Prefixed uploaded files
    location ${CLIENT_PUBLIC_URL}/uploads/ {
        rewrite ^${CLIENT_PUBLIC_URL}(/uploads/.*)$ $1 break;
        proxy_pass http://server_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix ${CLIENT_PUBLIC_URL};
    }

    # Client app hosted below a project prefix
    location ${CLIENT_PUBLIC_URL}/ {
        proxy_pass http://client_app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Root location serves client app
    location / {
        proxy_pass http://client_app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legacy root-level backend routes kept for compatibility
    location /api/ {
        proxy_pass http://server_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://server_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /uploads/ {
        proxy_pass http://server_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
